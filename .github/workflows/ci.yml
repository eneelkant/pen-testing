name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  # Never cancel in-flight verification on main (rapid merges previously cancelled
  # post-merge Docker isolation runs). Feature branches may still cancel superseded runs.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -r requirements/dev.txt

      - name: Compileall
        run: python -m compileall core integrations providers mcp_server installers

      - name: Unit tests
        run: python -m pytest -q tests/unit

      - name: Scanner isolation tests (must not be skipped)
        run: |
          set -euo pipefail
          test -f tests/unit/test_scanner_isolation.py
          OUT="$(python -m pytest -q tests/unit/test_scanner_isolation.py)"
          echo "$OUT"
          echo "$OUT" | grep -E '^[0-9]+ passed' >/dev/null
          # Fail if the module collects fewer than 10 tests (skipped/emptied).
          COUNT="$(python -m pytest tests/unit/test_scanner_isolation.py --collect-only -q | grep -c '::test_')"
          test "$COUNT" -ge 10

      - name: MCP tool surface
        run: |
          python - <<'PY'
          import asyncio
          from mcp_server.server import mcp
          result = mcp.list_tools()
          tools = asyncio.run(result) if asyncio.iscoroutine(result) else result
          names = sorted(t.name for t in tools)
          required = {
              "platform_status","check_dependencies","validate_target_scope",
              "list_integrations","run_local_diagnostics","run_security_assessment",
              "get_assessment_status","list_findings","export_report",
          }
          missing = sorted(required - set(names))
          assert not missing, missing
          print("mcp_tools_ok", names)
          PY

      - name: Smoke (no external targets)
        run: bash scripts/smoke.sh

  docker-runtime:
    name: Docker build and runtime
    runs-on: ubuntu-latest
    # Shannon Temporal + worker --validate-model E2E needs headroom beyond Compose probes.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Docker Engine and Compose on runner
        run: |
          set -euo pipefail
          command -v docker
          docker version
          docker compose version
          docker info >/dev/null

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js (Shannon CLI via npx)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install package (host smoke)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -r requirements/dev.txt

      - name: Docker runtime verification
        run: bash scripts/docker_runtime_verify.sh

      - name: Collect Docker diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "== docker compose ps =="
          docker compose --profile workers --profile fixtures ps -a
          echo "== docker images (project) =="
          docker images 'pen-testing-*'
          echo "== docker compose config =="
          docker compose config
          echo "== disk =="
          df -h

      - name: Cleanup compose resources
        if: always()
        run: |
          docker compose --profile workers --profile live-workers --profile fixtures down -v --remove-orphans || true
          docker rm -f pen-shannon-egress-gateway pen-shannon-fixture pen-shannon-llm-mock pen-shannon-redirect shannon-temporal || true
          docker ps -aq --filter "name=shannon-worker-" | xargs -r docker rm -f || true
          docker network rm shannon-net pen-shannon-egress pen-shannon-host || true

  # Separate from Docker runtime so a vulnerability-gate failure is not reported
  # as a Compose/runtime defect. The gate stays fail-closed.
  image-scan:
    name: Pinned image vulnerability scans
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -r requirements/dev.txt

      - name: Pinned base image vulnerability scan
        run: |
          set +e
          python -m core.supply_chain images --name python-3.12-probe \
            --raw-dir image-scan-raw/python \
            --output image-scan-python.json
          code=$?
          echo "PYTHON_IMAGE_SCAN_EXIT=${code}" >> "$GITHUB_ENV"
          test -f image-scan-python.json
          SCAN_EXIT="${code}" python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("image-scan-python.json").read_text())
          print(
              "python_image_scan",
              "status=", report.get("status"),
              "blocking=", report.get("blocking_count"),
              "rows=", report.get("finding_row_count"),
              "unique=", report.get("unique_cve_count"),
              "tool=", report.get("tool_version"),
              "db=", (report.get("database") or {}).get("updated_at"),
              "exit=", os.environ.get("SCAN_EXIT"),
          )
          PY

      - name: Upload Python image scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-scan-python
          path: image-scan-python.json
          if-no-files-found: error

      - name: Pinned upstream image vulnerability scan
        if: always()
        run: |
          set +e
          # Fixed HIGH/CRITICAL and unscored findings fail the absolute release gate.
          # Keep production pins until a candidate passes the same scan policy AND
          # any required compatibility/runtime tests. Never suppress inherited CVEs.
          python -m core.supply_chain images \
            --name shannon-worker \
            --name temporal \
            --name gitleaks \
            --name trivy-scanner \
            --raw-dir image-scan-raw/upstream \
            --output image-scan-upstream.json
          code=$?
          echo "UPSTREAM_IMAGE_SCAN_EXIT=${code}" >> "$GITHUB_ENV"
          test -f image-scan-upstream.json
          SCAN_EXIT="${code}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("image-scan-upstream.json").read_text())
          print(
              "upstream_image_scan",
              "status=", report.get("status"),
              "blocking=", report.get("blocking_count"),
              "rows=", report.get("finding_row_count"),
              "unique=", report.get("unique_cve_count"),
              "tool=", report.get("tool_version"),
              "db=", (report.get("database") or {}).get("updated_at"),
              "exit=", os.environ.get("SCAN_EXIT"),
          )
          images = report.get("images") or []
          if not images:
              raise SystemExit("No per-image results returned; report is not actionable.")
          print("\\nPer-image remediation summary:")
          for image in images:
              name = image.get("pin_name") or image.get("name") or image.get("image") or "unknown"
              blockers = image.get("findings") or []
              grouped = {}
              for finding in blockers:
                  if not finding.get("blocking"):
                      continue
                  key = (
                      str(finding.get("severity") or "UNKNOWN").upper(),
                      str(finding.get("id") or "NO_ID"),
                      str(finding.get("package") or "unknown"),
                      str(finding.get("fixed") or ""),
                  )
                  grouped[key] = grouped.get(key, 0) + 1
              print(
                  f"  {name}: status={image.get('status')} "
                  f"blocking={image.get('blocking_count')} "
                  f"unscored={image.get('unscored_count')} "
                  f"unfixed={image.get('unfixed_count')} "
                  f"digest={image.get('digest') or 'missing'}"
              )
              for (severity, cve, package, fixed), count in sorted(
                  grouped.items(), key=lambda item: (-item[1], item[0])
              )[:10]:
                  suffix = f" -> fixed in {fixed}" if fixed else " (no fixed version recorded)"
                  print(f"    {count}x {severity} {cve} package={package}{suffix}")
              if len(grouped) > 10:
                  print(f"    ... {len(grouped) - 10} more grouped blocker(s); see raw artifact")
          print(
              "Remediation: run the self-built image candidate workflow; update a production "
              "digest only after a clean verified scan and compatibility/runtime tests. "
              "Do not add .trivyignore entries or change the threshold to make this job green."
          )
          PY

      - name: Upload upstream image scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-scan-upstream
          path: image-scan-upstream.json
          if-no-files-found: error

      # Canonical JSON serialized from each image's parsed Trivy document (not the
      # original stdout bytes). The summaries above record the SHA-256 of each file's
      # exact on-disk bytes under images[].raw_evidence so reviewers can re-classify
      # raw findings instead of trusting the summary.
      - name: Upload raw Trivy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-scan-raw
          path: image-scan-raw/
          if-no-files-found: error

      - name: Enforce pinned image scan gates
        if: always()
        run: |
          set -euo pipefail
          echo "python_image_scan_exit=${PYTHON_IMAGE_SCAN_EXIT:-missing}"
          echo "upstream_image_scan_exit=${UPSTREAM_IMAGE_SCAN_EXIT:-missing}"
          test -n "${PYTHON_IMAGE_SCAN_EXIT:-}"
          test -n "${UPSTREAM_IMAGE_SCAN_EXIT:-}"
          test "${PYTHON_IMAGE_SCAN_EXIT}" -eq 0
          test "${UPSTREAM_IMAGE_SCAN_EXIT}" -eq 0

  # Merge regression gate (policy Option B). Fails on any blocking finding that is
  # not in the reviewed, digest-bound, unexpired baseline, on unknown digests, on
  # invalid baselines, and on unverified scans. It never changes the absolute
  # result above, which stays visible here and is the release gate (Option A).
  # A green regression gate does not mean the images are free of vulnerabilities.
  image-regression-gate:
    name: Pinned image regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -r requirements/dev.txt

      - name: Reject pin and baseline changes in the same pull request
        if: github.event_name == 'pull_request'
        run: python -m core.supply_chain baseline guard --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Regression gate against the reviewed baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m core.supply_chain images \
            --baseline core/supply_chain/image_baseline.json \
            --raw-dir image-regression-raw \
            --output image-regression.json

      - name: Upload regression gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-regression-gate
          path: |
            image-regression.json
            image-regression-raw/
          if-no-files-found: error

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/src:ro" zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 detect --source=/src --no-git --verbose

  dependency-audit:
    name: Dependency metadata check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Show locked intent
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text())
          deps = data["project"]["dependencies"]
          print("runtime deps:")
          for d in deps:
              print(" -", d)
          assert "pyyaml" in " ".join(deps).lower()
          PY

      - name: Dependency metadata audit and SBOM
        run: |
          set -euo pipefail
          python -m core.supply_chain audit
          python -m core.supply_chain emit --output "$RUNNER_TEMP/sbom.cdx.json"
          SBOM="$RUNNER_TEMP/sbom.cdx.json" python - <<'PY'
          import json
          import os
          from pathlib import Path
          doc = json.loads(Path(os.environ["SBOM"]).read_text())
          assert doc["bomFormat"] == "CycloneDX"
          assert "vulnerabilities" not in doc, "SBOM must not claim a vulnerability result"
          names = {item["name"] for item in doc["components"]}
          missing = {"pyyaml", "jsonschema"} - names
          assert not missing, missing
          print("sbom_ok", len(names))
          PY

      - name: OSV vulnerability query
        run: |
          set -euo pipefail
          python -m core.supply_chain vuln --output "$RUNNER_TEMP/osv.json"
          OSV="$RUNNER_TEMP/osv.json" python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ["OSV"]).read_text())
          print(
              "osv_status",
              report["status"],
              "blocking",
              report["blocking_count"],
              "queried",
              len(report["queried"]),
              "at",
              report["generated_at"],
          )
          if report["status"] != "PASS":
              raise SystemExit(report["status"])
          PY
