name: Image candidate monitor

# Watches official Hub tags for digests that pass the fail-closed image gate.
# Never updates pins and never merges. Separate from CI so a NO_ACCEPTABLE_CANDIDATE
# result does not fail pull-request checks.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  # Re-scan official candidate digests on security-image changes so new upstream
  # releases can be evaluated in PR CI. This is evidence-only: it never changes pins.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/image-candidate-monitor.yml"
      - "core/supply_chain/candidates.py"
      - "core/supply_chain/images.py"
      - "scripts/verify_image_candidate.py"
      - "scripts/verify_self_built_candidates.sh"
      - "docker/candidates/**"

permissions:
  contents: read

jobs:
  monitor:
    name: Watch official image candidates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -r requirements/dev.txt

      - name: Resolve and scan new official digests
        id: monitor
        run: |
          set +e
          # Committed reject inventory is loaded automatically. Optional local
          # overlay directory is created for workflow-produced reports on reruns.
          mkdir -p prior-candidate-evidence
          python -m core.supply_chain candidates \
            --evidence-dir prior-candidate-evidence \
            --output image-candidate-monitor.json
          code=$?
          echo "MONITOR_EXIT=${code}" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("image-candidate-monitor.json").read_text())
          print(
              "candidate_monitor",
              "status=", report.get("status"),
              "acceptable=", len(report.get("acceptable") or []),
              "candidates=", len(report.get("candidates") or []),
          )
          for row in report.get("candidates") or []:
              print(
                  " ",
                  row.get("name"),
                  "status=", row.get("status"),
                  "blocking=", row.get("blocking_count"),
                  "reused=", row.get("reused_evidence"),
                  "digest=", (row.get("digest") or "")[:19],
              )
          PY
          # Fail closed only when evidence is incomplete. NO_ACCEPTABLE_CANDIDATE is
          # an expected outcome while upstream images remain dirty.
          if [ "${code}" -eq 2 ]; then
            exit 2
          fi
          exit 0

      - name: Upload candidate monitor report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-candidate-monitor
          path: image-candidate-monitor.json
          if-no-files-found: error
