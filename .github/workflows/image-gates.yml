name: Image security gates

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: image-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: Detect image-sensitive changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_image_gate: ${{ steps.detect.outputs.needs_image_gate }}
      changed_sensitive_files_json: ${{ steps.detect.outputs.changed_sensitive_files_json }}
    steps:
      - name: Checkout full history for an exact base/head diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Classify changed paths
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
          else
            echo "::error::Unsupported event for image-gate change detection: $EVENT_NAME"
            exit 1
          fi
          python scripts/detect_image_sensitive_changes.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  image-scan:
    name: Pinned image vulnerability scans (scan)
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.needs_image_gate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -r requirements/dev.txt

      - name: Pinned base image vulnerability scan
        run: |
          set +e
          python -m core.supply_chain images --name python-3.12-probe \
            --raw-dir image-scan-raw/python \
            --output image-scan-python.json
          code=$?
          echo "PYTHON_IMAGE_SCAN_EXIT=${code}" >> "$GITHUB_ENV"
          test -f image-scan-python.json
          SCAN_EXIT="${code}" python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("image-scan-python.json").read_text())
          print(
              "python_image_scan",
              "status=", report.get("status"),
              "blocking=", report.get("blocking_count"),
              "rows=", report.get("finding_row_count"),
              "unique=", report.get("unique_cve_count"),
              "tool=", report.get("tool_version"),
              "db=", (report.get("database") or {}).get("updated_at"),
              "exit=", os.environ.get("SCAN_EXIT"),
          )
          PY

      - name: Upload Python image scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: image-scan-python
          path: image-scan-python.json
          if-no-files-found: error

      - name: Pinned upstream image vulnerability scan
        if: always()
        run: |
          set +e
          # Fixed HIGH/CRITICAL and unscored findings fail the absolute release gate.
          # Keep production pins until a candidate passes the same scan policy AND
          # any required compatibility/runtime tests. Never suppress inherited CVEs.
          python -m core.supply_chain images \
            --name shannon-worker \
            --name temporal \
            --name gitleaks \
            --name trivy-scanner \
            --raw-dir image-scan-raw/upstream \
            --output image-scan-upstream.json
          code=$?
          echo "UPSTREAM_IMAGE_SCAN_EXIT=${code}" >> "$GITHUB_ENV"
          test -f image-scan-upstream.json
          SCAN_EXIT="${code}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("image-scan-upstream.json").read_text())
          print(
              "upstream_image_scan",
              "status=", report.get("status"),
              "blocking=", report.get("blocking_count"),
              "rows=", report.get("finding_row_count"),
              "unique=", report.get("unique_cve_count"),
              "tool=", report.get("tool_version"),
              "db=", (report.get("database") or {}).get("updated_at"),
              "exit=", os.environ.get("SCAN_EXIT"),
          )
          images = report.get("images") or []
          if not images:
              raise SystemExit("No per-image results returned; report is not actionable.")
          print("\nPer-image remediation summary:")
          for image in images:
              name = image.get("pin_name") or image.get("name") or image.get("image") or "unknown"
              blockers = image.get("findings") or []
              grouped = {}
              for finding in blockers:
                  if not finding.get("blocking"):
                      continue
                  key = (
                      str(finding.get("severity") or "UNKNOWN").upper(),
                      str(finding.get("id") or "NO_ID"),
                      str(finding.get("package") or "unknown"),
                      str(finding.get("fixed") or ""),
                  )
                  grouped[key] = grouped.get(key, 0) + 1
              print(
                  f"  {name}: status={image.get('status')} "
                  f"blocking={image.get('blocking_count')} "
                  f"unscored={image.get('unscored_count')} "
                  f"unfixed={image.get('unfixed_count')} "
                  f"digest={image.get('digest') or 'missing'}"
              )
              for (severity, cve, package, fixed), count in sorted(
                  grouped.items(), key=lambda item: (-item[1], item[0])
              )[:10]:
                  suffix = f" -> fixed in {fixed}" if fixed else " (no fixed version recorded)"
                  print(f"    {count}x {severity} {cve} package={package}{suffix}")
              if len(grouped) > 10:
                  print(f"    ... {len(grouped) - 10} more grouped blocker(s); see raw artifact")
          print(
              "Remediation: run the self-built image candidate workflow; update a production "
              "digest only after a clean verified scan and compatibility/runtime tests. "
              "Do not add .trivyignore entries or change the threshold to make this job green."
          )
          PY

      - name: Upload upstream image scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: image-scan-upstream
          path: image-scan-upstream.json
          if-no-files-found: error

      # Canonical JSON serialized from each image's parsed Trivy document (not the
      # original stdout bytes). The summaries above record the SHA-256 of each file's
      # exact on-disk bytes under images[].raw_evidence so reviewers can re-classify
      # raw findings instead of trusting the summary.
      - name: Upload raw Trivy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: image-scan-raw
          path: image-scan-raw/
          if-no-files-found: error

      - name: Enforce pinned image scan gates
        if: always()
        run: |
          set -euo pipefail
          echo "python_image_scan_exit=${PYTHON_IMAGE_SCAN_EXIT:-missing}"
          echo "upstream_image_scan_exit=${UPSTREAM_IMAGE_SCAN_EXIT:-missing}"
          test -n "${PYTHON_IMAGE_SCAN_EXIT:-}"
          test -n "${UPSTREAM_IMAGE_SCAN_EXIT:-}"
          test "${PYTHON_IMAGE_SCAN_EXIT}" -eq 0
          test "${UPSTREAM_IMAGE_SCAN_EXIT}" -eq 0

  # Merge regression gate (policy Option B). Fails on any blocking finding that is
  # not in the reviewed, digest-bound, unexpired baseline, on unknown digests, on
  # invalid baselines, and on unverified scans. It never changes the absolute
  # result above, which stays visible here and is the release gate (Option A).
  # A green regression gate does not mean the images are free of vulnerabilities.

  image-regression-gate-scan:
    name: Pinned image regression gate (scan)
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.needs_image_gate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -r requirements/dev.txt

      - name: Reject pin and baseline changes in the same pull request
        if: github.event_name == 'pull_request'
        run: python -m core.supply_chain baseline guard --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Regression gate against the reviewed baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m core.supply_chain images \
            --baseline core/supply_chain/image_baseline.json \
            --raw-dir image-regression-raw \
            --output image-regression.json

      - name: Upload regression gate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: image-regression-gate
          path: |
            image-regression.json
            image-regression-raw/
          if-no-files-found: error

  # Stable required context. This job always reports, even when the scan job is
  # intentionally skipped for a non-image change. NOT_APPLICABLE is not scan
  # evidence and never satisfies the separate release-time absolute gate.
  image-regression-gate:
    name: Pinned image regression gate
    if: always()
    needs: [detect-changes, image-regression-gate-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source for the shared status evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Evaluate required regression-gate result
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          NEEDS_IMAGE_GATE: ${{ needs.detect-changes.outputs.needs_image_gate }}
          SCAN_RESULT: ${{ needs.image-regression-gate-scan.result }}
        run: python scripts/image_gate_status.py --gate regression

  # Visible but non-required absolute scan context. The actual absolute policy
  # remains release-enforced in release.yml and is not weakened here.
  image-vulnerability-scans:
    name: Pinned image vulnerability scans
    if: always()
    needs: [detect-changes, image-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source for the shared status evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Evaluate absolute image-scan result
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          NEEDS_IMAGE_GATE: ${{ needs.detect-changes.outputs.needs_image_gate }}
          SCAN_RESULT: ${{ needs.image-scan.result }}
        run: python scripts/image_gate_status.py --gate absolute
