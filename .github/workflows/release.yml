name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Release gate (policy Option A): every pinned image must have zero blocking
  # findings. The merge-time regression baseline is deliberately NOT used here.
  absolute-image-gate:
    name: Absolute pinned image gate (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -r requirements/dev.txt

      - name: Scan every pinned image (zero blocking findings required)
        run: python -m core.supply_chain images --raw-dir image-scan-raw --output image-scan-release.json

      - name: Upload release image scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-scan-release
          path: |
            image-scan-release.json
            image-scan-raw/
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [absolute-image-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -r requirements/dev.txt
          python -m pytest -q tests/unit
          bash scripts/smoke.sh

      - name: Build sdist/wheel (local artifacts only)
        run: |
          python -m pip install build
          python -m build
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
