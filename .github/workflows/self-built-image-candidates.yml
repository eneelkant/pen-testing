name: Self-built image candidates

on:
  pull_request:
    branches: [main]
    paths:
      - "docker/candidates/**"
      - "scripts/verify_image_candidate.py"
      - "scripts/verify_self_built_candidates.sh"
      - ".github/workflows/self-built-image-candidates.yml"
      - "docs/SELF_BUILT_IMAGE_CANDIDATES.md"
  workflow_dispatch:
    inputs:
      publish_candidates:
        description: "Publish to GHCR only when both candidates pass fresh scans"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: image-candidates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-scan:
    name: Build, scan, and runtime-test candidates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      shannon_acceptable: ${{ steps.candidate-evidence.outputs.shannon_acceptable }}
      trivy_acceptable: ${{ steps.candidate-evidence.outputs.trivy_acceptable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -r requirements/dev.txt

      - name: Set up Node.js for Shannon E2E
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Reject publish request from any ref other than main
        if: github.event_name == 'workflow_dispatch' && inputs.publish_candidates
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Candidate publication is allowed only from main."
            exit 1
          }

      - name: Build candidates, collect raw scans, and run runtime validation
        id: candidate-evidence
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_candidates }}" = "true" ]; then
            bash scripts/verify_self_built_candidates.sh --require-clean
          else
            bash scripts/verify_self_built_candidates.sh
          fi

      - name: Refuse requested publication if either candidate is not clean
        if: github.event_name == 'workflow_dispatch' && inputs.publish_candidates
        env:
          SHANNON_ACCEPTABLE: ${{ steps.candidate-evidence.outputs.shannon_acceptable }}
          TRIVY_ACCEPTABLE: ${{ steps.candidate-evidence.outputs.trivy_acceptable }}
        run: |
          test "$SHANNON_ACCEPTABLE" = "true"
          test "$TRIVY_ACCEPTABLE" = "true"

      - name: Upload local build and scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-built-image-candidate-evidence
          path: candidate-reports/
          if-no-files-found: error
          retention-days: 14

  publish-clean-candidates:
    name: Publish clean candidate digests to GHCR
    needs: [build-and-scan]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidates == true && github.ref == 'refs/heads/main' && needs.build-and-scan.outputs.shannon_acceptable == 'true' && needs.build-and-scan.outputs.trivy_acceptable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project test dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -r requirements/dev.txt

      - name: Set up Node.js for Shannon E2E
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Rebuild candidates and require clean local evidence
        run: bash scripts/verify_self_built_candidates.sh --require-clean

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish candidate tags and record immutable digests
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          TAG="candidate-${GITHUB_SHA:0:12}"
          SHANNON_LOCAL="local/shannon-worker-candidate:${GITHUB_SHA:0:12}"
          TRIVY_LOCAL="local/trivy-scanner-candidate:${GITHUB_SHA:0:12}"
          SHANNON_TARGET="ghcr.io/$OWNER/pen-testing-shannon-candidate"
          TRIVY_TARGET="ghcr.io/$OWNER/pen-testing-trivy-candidate"

          push_and_capture() {
            local local_ref="$1"
            local target="$2"
            local tag="$3"
            local log_file="$4"
            local target_tag="$target:$tag"
            docker tag "$local_ref" "$target_tag"
            docker push "$target_tag" 2>&1 | tee "$log_file"
            local digest
            digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$log_file" | tail -n1)"
            test -n "$digest" || { echo "::error::Registry push did not return a manifest digest for $target_tag"; exit 1; }
            printf '%s@%s\n' "$target" "$digest"
          }

          SHANNON_DIGEST_REF="$(push_and_capture "$SHANNON_LOCAL" "$SHANNON_TARGET" "$TAG" candidate-reports/shannon-push.log)"
          TRIVY_DIGEST_REF="$(push_and_capture "$TRIVY_LOCAL" "$TRIVY_TARGET" "$TAG" candidate-reports/trivy-push.log)"
          printf '%s\n' "$SHANNON_DIGEST_REF" > candidate-reports/shannon-published-digest.txt
          printf '%s\n' "$TRIVY_DIGEST_REF" > candidate-reports/trivy-published-digest.txt
          echo "shannon_digest_ref=$SHANNON_DIGEST_REF" >> "$GITHUB_OUTPUT"
          echo "trivy_digest_ref=$TRIVY_DIGEST_REF" >> "$GITHUB_OUTPUT"

      - name: Rescan published Shannon digest
        env:
          IMAGE_REF: ${{ steps.publish.outputs.shannon_digest_ref }}
        run: |
          set -euo pipefail
          mkdir -p candidate-reports "$HOME/.cache/trivy"
          TRIVY_SCANNER="$(python -c 'from core.supply_chain.images import TRIVY_IMAGE; print(TRIVY_IMAGE)')"
          docker pull --platform linux/amd64 "$TRIVY_SCANNER"
          docker run --rm --platform linux/amd64 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -w /work "$TRIVY_SCANNER" image --scanners vuln --format json \
            --output /work/candidate-reports/shannon-published.json --no-progress "$IMAGE_REF"
          python scripts/verify_image_candidate.py --image-ref "$IMAGE_REF" \
            --report candidate-reports/shannon-published.json \
            --summary candidate-reports/shannon-published-summary.json --require-clean

      - name: Rescan published Trivy digest
        env:
          IMAGE_REF: ${{ steps.publish.outputs.trivy_digest_ref }}
        run: |
          set -euo pipefail
          TRIVY_SCANNER="$(python -c 'from core.supply_chain.images import TRIVY_IMAGE; print(TRIVY_IMAGE)')"
          docker run --rm --platform linux/amd64 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -w /work "$TRIVY_SCANNER" image --scanners vuln --format json \
            --output /work/candidate-reports/trivy-published.json --no-progress "$IMAGE_REF"
          python scripts/verify_image_candidate.py --image-ref "$IMAGE_REF" \
            --report candidate-reports/trivy-published.json \
            --summary candidate-reports/trivy-published-summary.json --require-clean

      - name: Upload final digest-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-built-image-published-candidate-evidence
          path: candidate-reports/
          if-no-files-found: error
          retention-days: 30
