name: Verify GO-2026-5932 openpgp advisory applicability

# Builds TWO controlled Go binaries and scans them with the repo's pinned
# Trivy scanner to determine whether Trivy implements import-level
# reachability checks for advisories with ecosystem_specific.imports.
#
# 1. test-binary-no-openpgp: imports golang.org/x/crypto/bcrypt (NOT openpgp)
# 2. test-binary-with-openpgp: imports golang.org/x/crypto/openpgp (affected package)
#
# Uses 'go tool nm' (not 'strings') to check for actual code symbols.
# The 'strings' command matches embedded module metadata strings, not
# actual compiled code — 'go tool nm' lists actual symbols.
#
# The workflow exits successfully (exit 0) when both cases produce
# documented results. It is evidence collection, not a pass/fail gate.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-openpgp-advisory.yml"
      - "scripts/verify_openpgp_advisory.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build controlled Go binaries and scan for GO-2026-5932
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build binary WITHOUT openpgp (imports bcrypt only)
        run: |
          set -euo pipefail
          mkdir -p /tmp/testapp-no-openpgp
          cat > /tmp/testapp-no-openpgp/go.mod <<'GOMOD'
          module testapp-no-openpgp
          go 1.23
          require golang.org/x/crypto v0.31.0
          GOMOD
          cat > /tmp/testapp-no-openpgp/main.go <<'GO'
          package main
          import (
            "fmt"
            "golang.org/x/crypto/bcrypt"
          )
          func main() {
            h, _ := bcrypt.GenerateFromPassword([]byte("test"), bcrypt.DefaultCost)
            fmt.Println(string(h))
          }
          GO
          cd /tmp/testapp-no-openpgp
          go mod tidy
          echo "--- go.mod (no-openpgp) ---"
          cat go.mod
          CGO_ENABLED=0 go build -o /tmp/test-binary-no-openpgp .
          echo "--- go version -m (build metadata) ---"
          go version -m /tmp/test-binary-no-openpgp
          echo "--- go tool nm: checking for openpgp CODE symbols ---"
          # Use 'go tool nm' to list actual symbols (functions/variables)
          # NOT 'strings' which matches embedded module metadata strings
          if go tool nm /tmp/test-binary-no-openpgp 2>/dev/null | grep -i "openpgp"; then
            echo "::notice::openpgp code symbols found in no-openpgp binary (may indicate transitive import)"
          else
            echo "::notice::No openpgp code symbols found in no-openpgp binary — openpgp package is NOT compiled in"
          fi

      - name: Build binary WITH openpgp (imports the affected package)
        run: |
          set -euo pipefail
          mkdir -p /tmp/testapp-with-openpgp
          cat > /tmp/testapp-with-openpgp/go.mod <<'GOMOD'
          module testapp-with-openpgp
          go 1.23
          require golang.org/x/crypto v0.31.0
          GOMOD
          cat > /tmp/testapp-with-openpgp/main.go <<'GO'
          package main
          import (
            "fmt"
            "golang.org/x/crypto/openpgp"
            "golang.org/x/crypto/openpgp/armor"
          )
          func main() {
            _ = openpgp.Entity{}
            _ = armor.Header{}
            fmt.Println("openpgp imported")
          }
          GO
          cd /tmp/testapp-with-openpgp
          go mod tidy
          echo "--- go.mod (with-openpgp) ---"
          cat go.mod
          CGO_ENABLED=0 go build -o /tmp/test-binary-with-openpgp .
          echo "--- go version -m (build metadata) ---"
          go version -m /tmp/test-binary-with-openpgp
          echo "--- go tool nm: checking for openpgp CODE symbols ---"
          if go tool nm /tmp/test-binary-with-openpgp 2>/dev/null | grep -i "openpgp"; then
            echo "::notice::openpgp code symbols found in with-openpgp binary — openpgp package IS compiled in"
          else
            echo "::notice::No openpgp code symbols found in with-openpgp binary (unexpected)"
          fi

      - name: Scan both binaries with pinned Trivy
        run: |
          set -euo pipefail
          SCANNER="$(python -c 'from core.supply_chain.images import TRIVY_IMAGE; print(TRIVY_IMAGE)')"
          echo "Pinned scanner: $SCANNER"
          docker pull --platform linux/amd64 "$SCANNER" >/dev/null
          mkdir -p /tmp/scan-output
          for name in no-openpgp with-openpgp; do
            echo "=== scanning test-binary-$name ==="
            docker run --rm --platform linux/amd64 \
              -v /tmp/test-binary-$name:/test-binary:ro \
              -v /tmp/scan-output:/reports \
              "$SCANNER" rootfs --scanners vuln --format json --quiet \
              --output "/reports/scan-$name.json" / || true
            echo "--- scan-$name.json size: $(wc -c < /tmp/scan-output/scan-$name.json 2>/dev/null || echo 0) bytes ---"
          done

      - name: Analyze results and determine scanner behavior
        run: |
          set -euo pipefail
          python scripts/verify_openpgp_advisory.py \
            --no-openpgp-scan /tmp/scan-output/scan-no-openpgp.json \
            --with-openpgp-scan /tmp/scan-output/scan-with-openpgp.json

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: openpgp-advisory-test-evidence
          path: /tmp/scan-output/
          if-no-files-found: warn
          retention-days: 30
