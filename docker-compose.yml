# Docker Compose for orchestration and isolated workers.
# Active testing containers intentionally do NOT mount the Docker socket.
name: pen-testing

networks:
  # Default control plane / fixtures (external egress allowed for pulls & fixture HTTP).
  pen-control:
    driver: bridge
  # Default Briar worker network: internal = no external routing.
  pen-scanner-isolated:
    driver: bridge
    internal: true
  # Live Briar workers: internal only — outbound internet solely via egress-gateway.
  pen-scanner-live:
    driver: bridge
    internal: true
  # Egress leg for the gateway (not attached to Briar workers).
  pen-egress:
    driver: bridge

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: pen-testing-orchestrator:0.1.0
    user: "10001:10001"
    working_dir: /work
    networks:
      - pen-control
    environment:
      PEN_WORK_DIR: /work/workspaces
      PEN_REPORTS_DIR: /work/reports
      PEN_SCOPES_FILE: /work/scopes/registry.yaml
      PEN_REQUIRE_SCOPE: "true"
      PEN_REQUIRE_EGRESS_POLICY: "true"
      PEN_ALLOW_EGRESS_DISABLE: "false"
      PEN_ALLOW_SCOPE_DISABLE: "false"
      PEN_ALLOW_SHANNON_LIVE: "false"
      PEN_ALLOW_SHANNON_UNCONTAINED_NET: "false"
      PEN_ALLOW_BRIAR_LIVE: "false"
      PEN_ALLOW_BRIAR_HOST_NET: "false"
      PEN_BRIAR_EXEC: "compose"
      # Provider keys: pass through from host env / .env — never bake into image
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
    volumes:
      - ./scopes:/work/scopes:ro
      - pen_workspaces:/work/workspaces
      - pen_reports:/work/reports
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    command: ["python", "-m", "core.cli", "doctor"]

  # Isolated Briar worker (default workers profile): no external egress.
  briar:
    build:
      context: .
      dockerfile: docker/briar/Dockerfile
    image: pen-testing-briar:0.4.62
    user: "10002:10002"
    profiles: ["workers"]
    networks:
      - pen-scanner-isolated
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
    volumes:
      - pen_reports:/work/reports
      - pen_workspaces:/work/workspaces
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    # No Docker socket. Network is internal — cannot reach internet or host LAN.
    command: ["--help"]

  # Dual-homed destination filter for live Briar (and Shannon prepare script).
  egress-gateway:
    build:
      context: .
      dockerfile: docker/egress-gateway/Dockerfile
    image: pen-testing-egress-gateway:0.1.0
    user: "10003:10003"
    profiles: ["live-workers", "fixtures"]
    networks:
      pen-scanner-live:
        aliases: ["egress-gateway"]
      pen-egress: {}
    environment:
      PEN_PROXY_PORT: "3128"
      # Comma-separated hosts permitted through the proxy (deny-by-default when empty).
      PEN_PROXY_ALLOW_HOSTS: ${PEN_PROXY_ALLOW_HOSTS:-}
      # Comma-separated destination ports for proxied flows (default 80,443).
      PEN_PROXY_ALLOW_PORTS: ${PEN_PROXY_ALLOW_PORTS:-80,443}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5

  # Live Briar worker: no direct internet; optional proxied egress via gateway.
  # Still no Docker socket. Authorized fixtures are on-net (NO_PROXY).
  briar-live:
    build:
      context: .
      dockerfile: docker/briar/Dockerfile
    image: pen-testing-briar:0.4.62
    user: "10002:10002"
    profiles: ["live-workers"]
    networks:
      - pen-scanner-live
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      PEN_REQUIRE_EGRESS_POLICY: "true"
      PEN_ALLOW_EGRESS_DISABLE: "false"
      HTTP_PROXY: http://egress-gateway:3128
      HTTPS_PROXY: http://egress-gateway:3128
      http_proxy: http://egress-gateway:3128
      https_proxy: http://egress-gateway:3128
      NO_PROXY: egress-gateway,fixture-headers,localhost,127.0.0.1
      no_proxy: egress-gateway,fixture-headers,localhost,127.0.0.1
    volumes:
      - pen_reports:/work/reports
      - pen_workspaces:/work/workspaces
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      - egress-gateway
    command: ["--help"]

  # Intentionally vulnerable local fixture for safe integration tests (no external targets).
  # On pen-control (orchestrator) and pen-scanner-live (authorized Briar compose path).
  fixture-headers:
    image: python:3.12-slim-bookworm
    profiles: ["fixtures"]
    user: "10001:10001"
    working_dir: /app
    networks:
      - pen-control
      - pen-scanner-live
    volumes:
      - ./tests/fixtures/headers_server.py:/app/headers_server.py:ro
    command: ["python", "/app/headers_server.py", "8080"]
    ports:
      - "18080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5

volumes:
  pen_workspaces:
  pen_reports:
