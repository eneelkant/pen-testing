[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pen-testing-platform"
version = "0.1.0"
description = "Modular orchestration platform for authorized security testing (Shannon, Briar, and scanners)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "eneelkant" }]
keywords = ["security", "penetration-testing", "bug-bounty", "orchestration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
pen-testing = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "integrations*", "providers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that may need optional external tools",
  "docker: tests that require Docker Engine",
]

[tool.coverage.run]
source = ["core", "integrations", "providers"]
omit = ["tests/*"]
